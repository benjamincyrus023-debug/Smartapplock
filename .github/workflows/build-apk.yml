name: Build Smart AppLock APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SmartAppLock_GitHub_Build_Project.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q SmartAppLock_GitHub_Build_Project.zip -d buildsrc

      - name: Build APK
        working-directory: buildsrc/SmartAppLock
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAppLock-APK
          path: buildsrc/SmartAppLock/app/build/outputs/apk/debug/app-debug.apk
